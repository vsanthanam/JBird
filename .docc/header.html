<style>
  :host {
    display: block;
    border-bottom: 1px solid var(--color-grid);
    background-color: var(--color-fill);
    font-family: var(--typography-html-font, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif);
    --site-gradient: linear-gradient(135deg, #0066cc, #5856d6, #c644fc);
  }

  @media (prefers-color-scheme: dark) {
    :host([data-color-scheme="auto"]) {
      --site-gradient: linear-gradient(135deg, #80ddff 0%, #9580ff 35%, #d580ff 65%, #ff80bf 100%);
    }
  }

  :host([data-color-scheme="dark"]) {
    --site-gradient: linear-gradient(135deg, #80ddff 0%, #9580ff 35%, #d580ff 65%, #ff80bf 100%);
  }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem 1.5rem;
    max-width: 1920px;
    margin: 0 auto;
    padding: 0.75rem 1.375rem;
  }

  a {
    text-decoration: none;
  }

  .title {
    font-size: 1.375rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    background: var(--site-gradient);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .links {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem 1.5rem;
    font-size: 0.9375rem;
    font-weight: 500;
  }

  .links a {
    color: var(--color-figure-gray-secondary);
  }

  .links a:hover,
  .links a.active {
    color: var(--color-text);
  }

  .links a.active {
    font-weight: 600;
  }

  .links svg {
    display: block;
    width: 1.25rem;
    height: 1.25rem;
    fill: currentColor;
  }

  .short {
    display: none;
  }

  /* On narrow screens, keep everything on one row: shorten labels and drop
     links that are less useful while reading the documentation. */
  @media (max-width: 600px) {
    nav {
      flex-wrap: nowrap;
    }

    .links {
      flex-wrap: nowrap;
      gap: 1.125rem;
    }

    .long,
    .wide-only {
      display: none;
    }

    .short {
      display: inline;
    }
  }
</style>
