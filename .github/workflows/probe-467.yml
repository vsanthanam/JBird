# Throwaway probe workflow for https://github.com/vsanthanam/JBird/issues/467. Not for landing.
name: Probe 467
permissions:
  contents: read

on:
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  macos:
    name: macOS host (${{ matrix.runner }}, Xcode ${{ matrix.xcode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: "latest"
          - runner: macos-26
            xcode: "26.6"
          - runner: xcode-27
            xcode: "27.0"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: |
          if [ "${{ matrix.xcode }}" = "latest" ]; then
            ls -d /Applications/Xcode*.app
            X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
            sudo xcode-select --switch "$X"
          else
            ./.scripts/xcode-select ${{ matrix.xcode }}
          fi
          sw_vers; swift --version; ls -la /usr/lib/swift/libswiftSynchronization.dylib 2>&1 || true
      - name: Standalone probe
        run: |
          for opt in -Onone -O; do
            swiftc $opt Probes/MutexProbe.swift Probes/main.swift -o /tmp/probe$opt && /tmp/probe$opt | sed "s/^PROBE /RESULT [${{ matrix.runner }} | standalone $opt] /"
          done
      - name: JBird probe
        run: Probes/run-spm.sh "${{ matrix.runner }} Xcode ${{ matrix.xcode }}"

  simulators:
    name: Simulators (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: "26.6"
          - runner: xcode-27
            xcode: "27.0"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: ./.scripts/xcode-select ${{ matrix.xcode }}
      - name: Try to install iOS 18 runtime
        continue-on-error: true
        timeout-minutes: 30
        run: |
          xcrun simctl list runtimes | grep -q "iOS 18" || xcodebuild -downloadPlatform iOS -buildVersion 18.6
      - name: Run probes on simulators
        run: Probes/run-simulators.sh "${{ matrix.runner }}"

  linux:
    name: Linux (Swift ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["6.2.4", "6.3.3", "6.4.0"]
    runs-on: ubuntu-latest
    container:
      image: swift:${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v6
      - name: Standalone probe
        run: |
          for opt in -Onone -O; do
            swiftc $opt Probes/MutexProbe.swift Probes/main.swift -o /tmp/probe$opt && /tmp/probe$opt | sed "s/^PROBE /RESULT [linux ${{ matrix.toolchain }} | standalone $opt] /"
          done
      - name: JBird probe
        run: Probes/run-spm.sh "linux ${{ matrix.toolchain }}"

  linux-arm:
    name: Linux arm64 (Swift 6.4.0)
    runs-on: ubuntu-24.04-arm
    container:
      image: swift:6.4.0
    steps:
      - uses: actions/checkout@v6
      - name: JBird probe
        run: Probes/run-spm.sh "linux-arm64 6.4.0"

  windows:
    name: Windows (Swift ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: "6.2.4"
          - toolchain: "6.3.3"
          - toolchain: "6.4.0"
            extra-flags: "--disable-experimental-prebuilts"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-${{ matrix.toolchain }}-release
          swift-build: ${{ matrix.toolchain }}-RELEASE
      - name: Standalone probe
        shell: bash
        run: |
          for opt in -Onone -O; do
            swiftc $opt Probes/MutexProbe.swift Probes/main.swift -o probe$opt.exe && ./probe$opt.exe | sed "s/^PROBE /RESULT [windows ${{ matrix.toolchain }} | standalone $opt] /"
          done
      - name: JBird probe
        shell: bash
        run: Probes/run-spm.sh "windows ${{ matrix.toolchain }}" --disable-xctest -Xlinker /INCREMENTAL:NO ${{ matrix.extra-flags }}

  wasm:
    name: WebAssembly (Swift 6.4.0)
    runs-on: ubuntu-latest
    container:
      image: swift:6.4.0
    steps:
      - uses: actions/checkout@v6
      - name: Setup Swift WASM
        run: |
          swift sdk install https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d
      - name: JBird probe
        run: Probes/run-spm.sh "wasm 6.4.0" --swift-sdk swift-6.4.0-RELEASE_wasm --disable-experimental-prebuilts

  android:
    name: Android (Swift ${{ matrix.toolchain }}, ${{ matrix.variant }}, ${{ matrix.config }})
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["6.3.3", "6.4.0"]
        variant: ["original", "fixed"]
        config: ["debug", "release"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply fix
        if: ${{ matrix.variant == 'fixed' }}
        run: |
          perl -0pi -e 's/(Mutex<Value>\.self\)\n(\s*))pointer\.deinitialize\(count: 1\)/$1_ = pointer.move()/' Sources/JBirdCodableSupport/CompatibilityMutex.swift
          git diff
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build and run probe on emulator
        uses: skiptools/swift-android-action@v2
        with:
          swift-version: ${{ matrix.toolchain }}
          swift-configuration: ${{ matrix.config }}
          build-tests: true
          run-tests: true
          android-api-level: 30
          swift-test-flags: "--filter ZZLeakProbe"
