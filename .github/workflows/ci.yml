name: JBird CI
permissions:
  contents: read
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Analyze Changes
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.set.outputs.swift }}
      c: ${{ steps.set.outputs.c }}
      yaml: ${{ steps.set.outputs.yaml }}
      markdown: ${{ steps.set.outputs.markdown }}
      code: ${{ steps.set.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get changed files
        id: changed
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "swift=true" >> $GITHUB_OUTPUT
            echo "c=true" >> $GITHUB_OUTPUT
            echo "yaml=true" >> $GITHUB_OUTPUT
            echo "markdown=true" >> $GITHUB_OUTPUT
            echo "code=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          CHANGED_FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }})
          echo "Changed files:"
          echo "$CHANGED_FILES"

          HAS_SWIFT=false
          HAS_C=false
          HAS_YAML=false
          HAS_MD=false
          ONLY_MD=true

          for file in $CHANGED_FILES; do
            [[ "$file" =~ \.swift$ ]] && HAS_SWIFT=true
            [[ "$file" =~ \.c$ || "$file" =~ \.h$ ]] && HAS_C=true
            [[ "$file" =~ \.ya?ml$ ]] && HAS_YAML=true
            [[ "$file" =~ \.md$ ]] && HAS_MD=true

            if [[ ! "$file" =~ \.md$ ]]; then
              ONLY_MD=false
            fi
          done

          echo "swift=$([[ $HAS_SWIFT == true ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "c=$([[ $HAS_C == true ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "yaml=$([[ $HAS_YAML == true ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "markdown=$([[ $HAS_MD == true ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "code=$([[ $ONLY_MD == true ]] && echo false || echo true)" >> $GITHUB_OUTPUT
      - name: Set final outputs
        id: set
        run: |
          echo "swift=${{ steps.changed.outputs.swift }}" >> $GITHUB_OUTPUT
          echo "c=${{ steps.changed.outputs.c }}" >> $GITHUB_OUTPUT
          echo "yaml=${{ steps.changed.outputs.yaml }}" >> $GITHUB_OUTPUT
          echo "markdown=${{ steps.changed.outputs.markdown }}" >> $GITHUB_OUTPUT
          echo "code=${{ steps.changed.outputs.code }}" >> $GITHUB_OUTPUT
  build-xcode:
    strategy:
      matrix:
        platform: ['macos', 'maccatalyst', 'ios', 'watchos', 'tvos', 'visionos']
        include:
          - platform: 'macos'
            name: 'macOS'
          - platform: 'maccatalyst'
            name: 'macOS (Catalyst)'
          - platform: 'ios'
            name: 'iOS'
          - platform: 'watchos'
            name: 'watchOS'
          - platform: 'tvos'
            name: 'tvOS'
          - platform: 'visionos'
            name: 'visionOS'
        scheme: [JBird, JBirdCore, JBirdBuilders]
    name: Build with Xcode (${{ matrix.scheme }}, ${{ matrix.name }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: macos-26
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Select Xcode Version
      run: ./.scripts/xcode-select
    - name: Build ${{ matrix.scheme }} for ${{ matrix.name }}
      run: ./.scripts/build-${{ matrix.platform }}-xcode ${{ matrix.scheme }}
  swiftformat:
    name: Run SwiftFormat 
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' || needs.changes.outputs.yaml == 'true' }}
    runs-on: macos-26
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Select Xcode Version
      run: ./.scripts/xcode-select
    - name: Lint with SwiftFormat
      run: ./.scripts/lint-swiftformat
  build-macos-spm:
    name: Build JBird (macOS)
    strategy:
      matrix:
        swift: ['6.1', '6.2']
        include:
          - swift: '6.1'
            runner: 'macos-15'
            xcode: '16.4'
          - swift: '6.2'
            runner: 'macos-26'
            xcode: '26.0'
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' || needs.changes.outputs.c == 'true' || needs.changes.outputs.yaml == 'true' }}
    runs-on: ${{ matrix.runner }}
    outputs:
      artifact-name: macos-build
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Select Xcode Version
      run: ./.scripts/xcode-select ${{ matrix.xcode }}
    - name: Build JBird
      run: swift build -v --build-path .build
    - name: Compress Build
      run: zip -r build.zip .build
    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: macos-build-${{ matrix.swift }}
        path: build.zip
  test-macos-spm:
    name: Test JBird (macOS)
    strategy:
      matrix:
        swift: ['6.1', '6.2']
        include:
          - swift: '6.1'
            runner: 'macos-15'
            xcode: '16.4'
          - swift: '6.2'
            runner: 'macos-26'
            xcode: '26.0'
    needs: [build-macos-spm, changes]
    if: ${{ needs.changes.outputs.swift == 'true' || needs.changes.outputs.c == 'true' || needs.changes.outputs.yaml == 'true' }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Xcode Version
        run: ./.scripts/xcode-select ${{ matrix.xcode }}
      - name: Download Build
        uses: actions/download-artifact@v4
        with:
          name: macos-build-${{ matrix.swift }}
          path: .
      - name: Decompress Build
        run: unzip build.zip
      - name: Test JBird
        run: swift test
  build-ubuntu-spm:
    name: Build JBird (Ubuntu)
    strategy:
      matrix:
        swift: ['6.1', '6.2']
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' || needs.changes.outputs.c == 'true' || needs.changes.outputs.yaml == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ubuntu-build
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build JBird
        run: swift build -v --build-path .build
      - name: Install `zip`
        run: apt-get update && apt-get install -y zip
      - name: Compress Build
        run: zip -r build.zip .build
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-build-${{ matrix.swift }}
          path: build.zip
  test-ubuntu-spm:
    name: Test JBird (Ubuntu)
    strategy:
      matrix:
        swift: ['6.1', '6.2']
    needs: [build-ubuntu-spm, changes]
    if: ${{ needs.changes.outputs.swift == 'true' || needs.changes.outputs.c == 'true' || needs.changes.outputs.yaml == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Build
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-build-${{ matrix.swift }}
          path: .
      - name: Install `unzip`
        run: apt-get update && apt-get install -y unzip
      - name: Decompress Build
        run: unzip build.zip
      - name: Test JBird
        run: swift test
  build-test-windows-spm:
    name: Test JBird (Windows)
    strategy:
      matrix:
        # TODO: - Investigate why unit tests for 6.1 don't work in CI
        # swift: ['6.1', '6.2']
        swift: ['6.2']
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' || needs.changes.outputs.c == 'true' || needs.changes.outputs.yaml == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ matrix.swift }}
      - name: Build JBird
        run: swift build -v --build-path .build
      - name: Compress Build
        shell: pwsh
        run: |
          Compress-Archive -Path ".build" -DestinationPath "build.zip" -Force
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ matrix.swift }}
          path: build.zip
      - name: Test JBird
        run: swift test
  # TODO: - Separate build / test jobs for Windows
  # test-windows-spm:
  #   name: Test JBird (Windows)
  #   strategy:
  #     matrix:
  #       swift: ['6.2']
  #   needs: [build-windows-spm, changes]
  #   if: ${{ needs.changes.outputs.swift == 'true' || needs.changes.outputs.c == 'true' || needs.changes.outputs.yaml == 'true' }}
  #   runs-on: windows-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4
  #     - name: Setup Swift
  #       uses: SwiftyLab/setup-swift@latest
  #       with:
  #         swift-version: ${{ matrix.swift }}
  #     - name: Download Build
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: windows-build-${{ matrix.swift }}
  #         path: .
  #     - name: Decompress Build
  #       shell: pwsh
  #       run: |
  #         Expand-Archive -Path "build.zip" -DestinationPath "." -Force
  #     - name: Test JBird
  #       run: swift test --disable-xctest --skip-build
  clang-format:
    name: Run clang-format
    needs: changes
    if: ${{ needs.changes.outputs.c == 'true' || needs.changes.outputs.yaml == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Validate formatting
        run: ./.scripts/lint-clang-format
  lint-docc:
    name: Validate Documentation
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' || needs.changes.outputs.yaml == 'true' || needs.changes.outputs.markdown == 'true' }}
    runs-on: macos-26
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Select Xcode Version
      run: ./.scripts/xcode-select
    - name: Validate Documentation
      run: ./.scripts/lint-docc
  build-xcframework:
    strategy:
      matrix:
        target: [JBird, JBirdCore, JBirdBuilders]
    name: Build XCFramework (${{ matrix.target }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: macos-26
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Select Xcode Version
      run: ./.scripts/xcode-select
    - name: Build XCFramework
      run: ./.scripts/build-xcframework ${{ matrix.target }}
  validate-pr:
    name: Validate Pull Request
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - build-xcode
      - build-macos-spm
      - test-macos-spm
      - build-ubuntu-spm
      - test-ubuntu-spm
      - build-test-windows-spm
      # - build-windows-spm
      # - test-windows-spm
      - build-xcframework
      - swiftformat
      - clang-format
      - lint-docc
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream jobs
        run: |
          # If any job failed, this status will not be 'success'
          if [[ "${{ needs.build-xcode.result }}" == "failure" ]] || \
            [[ "${{ needs.build-macos-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.test-macos-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.build-ubuntu-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.test-ubuntu-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.build-test-windows-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.build-xcframework.result }}" == "failure" ]] || \
            [[ "${{ needs.swiftformat.result }}" == "failure" ]] || \
            [[ "${{ needs.clang-format.result }}" == "failure" ]] || \
            [[ "${{ needs.lint-docc.result }}" == "failure" ]]; then
            echo "❌ Upstream job failed."
            exit 1
          else
            echo "✅ All required jobs completed successfully."
          fi