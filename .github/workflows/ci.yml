name: JBird CI
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - "main"
      - "*release*"
  pull_request:
    branches:
      - "main"
      - "*release*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-xcode:
    name: Build JBird (iOS)
    strategy:
      fail-fast: false
      matrix:
        version: ["27.1", "26.6", "18.6", "17.7", "16.6"]
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select 27.1
      - name: Build JBird for iOS ${{ matrix.version }}
        run: ./.scripts/build-ios-xcode JBird ${{ matrix.version }}

  build-tvos-xcode:
    name: Build JBird (tvOS)
    strategy:
      fail-fast: false
      matrix:
        version: ["27.0", "26.6", "18.6", "17.7", "16.6"]
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select 27.1
      - name: Build JBird for tvOS ${{ matrix.version }}
        run: ./.scripts/build-tvos-xcode JBird ${{ matrix.version }}

  build-watchos-xcode:
    name: Build JBird (watchOS)
    strategy:
      fail-fast: false
      matrix:
        version: ["27.0", "26.6", "11.6", "10.7", "9.6"]
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select 27.1
      - name: Build JBird for watchOS ${{ matrix.version }}
        run: ./.scripts/build-watchos-xcode JBird ${{ matrix.version }}

  build-macos-xcode:
    name: Build JBird (macOS)
    strategy:
      fail-fast: false
      matrix:
        version: ["27.0", "26.5"]
        include:
          - version: "27.0"
            runner: xcode-27
            xcode: "27.1"
          - version: "26.5"
            runner: macos-26
            xcode: "26.6"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select ${{ matrix.xcode }}
      - name: List SDKs
        run: xcodebuild -showsdks | grep macosx
      - name: Build JBird for macOS ${{ matrix.version }}
        run: ./.scripts/build-macos-xcode JBird ${{ matrix.version }}

  build-maccatalyst-xcode:
    name: Build JBird (Mac Catalyst)
    strategy:
      fail-fast: false
      matrix:
        version: ["27.0", "26.5"]
        include:
          - version: "27.0"
            runner: xcode-27
            xcode: "27.1"
          - version: "26.5"
            runner: macos-26
            xcode: "26.6"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select ${{ matrix.xcode }}
      - name: List SDKs
        run: xcodebuild -showsdks | grep macosx
      - name: Build JBird for Mac Catalyst ${{ matrix.version }}
        run: ./.scripts/build-maccatalyst-xcode JBird ${{ matrix.version }}

  build-visionos-xcode:
    name: Build JBird (visionOS)
    strategy:
      fail-fast: false
      matrix:
        version: ["27.0", "26.6", "2.6", "1.7"]
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select 27.1
      - name: Build JBird for visionOS ${{ matrix.version }}
        run: ./.scripts/build-visionos-xcode JBird ${{ matrix.version }}

  build-macos-spm:
    name: Build JBird (macOS)
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2", "6.3", "6.4"]
        include:
          - swift: "6.2"
            runner: "macos-26"
            xcode: "26.6"
          - swift: "6.3"
            runner: "macos-26"
            xcode: "26.6"
          - swift: "6.4"
            runner: "xcode-27"
            xcode: "27.1"
    runs-on: ${{ matrix.runner }}
    outputs:
      artifact-name: macos-build
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select ${{ matrix.xcode }}
      - name: Build JBird
        run: swift build -v --build-tests --build-path .build
      - name: Compress Build
        run: zip -r build.zip .build
      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: macos-build-${{ matrix.swift }}
          path: build.zip

  test-macos-spm:
    name: Test JBird (macOS)
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2", "6.3", "6.4"]
        include:
          - swift: "6.2"
            runner: "macos-26"
            xcode: "26.6"
          - swift: "6.3"
            runner: "macos-26"
            xcode: "26.6"
          - swift: "6.4"
            runner: "xcode-27"
            xcode: "27.1"
    needs: build-macos-spm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Xcode Version
        run: ./.scripts/xcode-select ${{ matrix.xcode }}
      - name: Download Build
        uses: actions/download-artifact@v8
        with:
          name: macos-build-${{ matrix.swift }}
          path: .
      - name: Decompress Build
        run: unzip build.zip
      - name: Test JBird
        run: swift test --skip-build

  build-ubuntu-spm:
    name: Build JBird (Ubuntu)
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2", "6.3", "6.4"]
        include:
          - swift: "6.2"
            toolchain: "6.2.4"
          - swift: "6.3"
            toolchain: "6.3.3"
          - swift: "6.4"
            toolchain: "6.4.1"
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ubuntu-build
    container:
      image: swift:${{ matrix.toolchain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build JBird
        run: swift build -v --build-tests --build-path .build
      - name: Install `zip`
        run: apt-get update && apt-get install -y zip
      - name: Compress Build
        run: zip -r build.zip .build
      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-build-${{ matrix.swift }}
          path: build.zip

  test-ubuntu-spm:
    name: Test JBird (Ubuntu)
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2", "6.3", "6.4"]
        include:
          - swift: "6.2"
            toolchain: "6.2.4"
          - swift: "6.3"
            toolchain: "6.3.3"
          - swift: "6.4"
            toolchain: "6.4.1"
    needs: build-ubuntu-spm
    runs-on: ubuntu-latest
    container:
      image: swift:${{ matrix.toolchain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download Build
        uses: actions/download-artifact@v8
        with:
          name: ubuntu-build-${{ matrix.swift }}
          path: .
      - name: Install `unzip`
        run: apt-get update && apt-get install -y unzip
      - name: Decompress Build
        run: unzip build.zip
      - name: Test JBird
        run: swift test --skip-build

  build-windows-spm:
    name: Build JBird (Windows)
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2", "6.3", "6.4"]
        include:
          - swift: "6.2"
            toolchain: "6.2.4"
          - swift: "6.3"
            toolchain: "6.3.3"
          - swift: "6.4"
            toolchain: "6.4.1"
            # The 6.4 build engine touches resource bundles while their contents are still being
            # written. Compiling swift-syntax from source instead of using the prebuilt keeps the
            # two tasks apart. See https://github.com/vsanthanam/JBird/issues/436.
            extra-flags: "--disable-experimental-prebuilts"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-${{ matrix.toolchain }}-release
          swift-build: ${{ matrix.toolchain }}-RELEASE
      - name: Build JBird
        run: swift build -v --build-tests --disable-xctest --build-path .build -c debug -Xlinker /INCREMENTAL:NO ${{ matrix.extra-flags }}
      - name: Compress Build
        shell: pwsh
        run: |
          Compress-Archive -Path ".build" -DestinationPath "build.zip" -Force
      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-${{ matrix.swift }}
          path: build.zip

  test-windows-spm:
    name: Test JBird (Windows)
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2", "6.3", "6.4"]
        include:
          - swift: "6.2"
            toolchain: "6.2.4"
          - swift: "6.3"
            toolchain: "6.3.3"
          - swift: "6.4"
            toolchain: "6.4.1"
    needs: build-windows-spm
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-${{ matrix.toolchain }}-release
          swift-build: ${{ matrix.toolchain }}-RELEASE
      - name: Download Build
        uses: actions/download-artifact@v8
        with:
          name: windows-build-${{ matrix.swift }}
          path: .
      - name: Decompress Build
        shell: pwsh
        run: |
          Expand-Archive -Path "build.zip" -DestinationPath "." -Force
      - name: Test JBird
        run: swift test --disable-xctest --skip-build

  build-wasm-spm:
    name: Build JBird (WebAssembly)
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2", "6.3", "6.4"]
        include:
          - swift: "6.2"
            toolchain: "6.2.4"
            sdk: "swift-6.2.4-RELEASE_wasm"
            url: "https://download.swift.org/swift-6.2.4-release/wasm-sdk/swift-6.2.4-RELEASE/swift-6.2.4-RELEASE_wasm.artifactbundle.tar.gz"
            checksum: "32fdb8772d73bb174f77b5c59bc88a0d55003d75712832129394d3465158fb43"
          - swift: "6.3"
            toolchain: "6.3.3"
            sdk: "swift-6.3.3-RELEASE_wasm"
            url: "https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz"
            checksum: "cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7"
          - swift: "6.4"
            toolchain: "6.4.1"
            sdk: "swift-6.4.1-RELEASE_wasm"
            url: "https://download.swift.org/swift-6.4.1-release/wasm-sdk/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE_wasm.artifactbundle.tar.gz"
            checksum: "783e6128d174d9f975b4eda68be02a5960681b723ef372e6876a7c2543a365d8"
            # Test binaries are only built (and run, see test-wasm-spm) on 6.4. The prebuilt
            # swift-syntax archive is a host (macOS/Linux) library, and SwiftPM substitutes it into
            # the wasm test-runner link, so swift-syntax is compiled from source for wasm instead.
            extra-flags: "--build-tests --disable-experimental-prebuilts"
    runs-on: ubuntu-latest
    container:
      image: swift:${{ matrix.toolchain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Swift WASM (${{ matrix.swift }})
        run: |
          swift sdk install ${{ matrix.url }} \
            --checksum ${{ matrix.checksum }}
          swift sdk list
      - name: Build JBird (${{ matrix.swift }})
        run: swift build -v --swift-sdk ${{ matrix.sdk }} --build-path .build ${{ matrix.extra-flags }}
      - name: Install `zip`
        run: apt-get update && apt-get install -y zip
      - name: Compress Build
        run: zip -r build.zip .build
      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: wasm-build-${{ matrix.swift }}
          path: build.zip

  test-wasm-spm:
    name: Test JBird (WebAssembly)
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.4"]
        include:
          - swift: "6.4"
            toolchain: "6.4.1"
            sdk: "swift-6.4.1-RELEASE_wasm"
            url: "https://download.swift.org/swift-6.4.1-release/wasm-sdk/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE_wasm.artifactbundle.tar.gz"
            checksum: "783e6128d174d9f975b4eda68be02a5960681b723ef372e6876a7c2543a365d8"
    needs: build-wasm-spm
    runs-on: ubuntu-latest
    container:
      image: swift:${{ matrix.toolchain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Swift WASM (${{ matrix.swift }})
        run: |
          swift sdk install ${{ matrix.url }} \
            --checksum ${{ matrix.checksum }}
          swift sdk list
      - name: Download Build
        uses: actions/download-artifact@v8
        with:
          name: wasm-build-${{ matrix.swift }}
          path: .
      - name: Install `unzip`
        run: apt-get update && apt-get install -y unzip
      - name: Decompress Build
        run: unzip build.zip
      - name: Test JBird (${{ matrix.swift }})
        # The toolchain ships WasmKit, which SwiftPM uses to execute the wasm test binaries.
        run: swift test --swift-sdk ${{ matrix.sdk }} --build-path .build --skip-build --disable-experimental-prebuilts

  build-android-spm:
    name: Build JBird (Android)
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.3", "6.4"]
        include:
          - swift: "6.3"
            toolchain: "6.3.3"
            sdk: "swift-6.3.3-RELEASE_android"
            url: "https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz"
            checksum: "d160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5"
            # The 6.3.3 Android SDK only defines triples for API 28 and later.
            android-api: "28"
          - swift: "6.4"
            toolchain: "6.4.1"
            sdk: "swift-6.4.1-RELEASE_android"
            url: "https://download.swift.org/swift-6.4.1-release/android-sdk/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE_android.artifactbundle.tar.gz"
            checksum: "a356b79f8f1daa6ae3a66f4c556966ca20c0208b3659805cf30a83a0a31d6772"
            android-api: "23"
            # Test binaries are only built (and run, see test-android-spm) on 6.4. Prebuilt
            # swift-syntax is disabled so that it is compiled from source for the Android target,
            # matching build-wasm-spm.
            extra-flags: "--build-tests --disable-experimental-prebuilts"
    runs-on: ubuntu-latest
    container:
      image: swift:${{ matrix.toolchain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Swift Android (${{ matrix.swift }})
        run: |
          swift sdk install ${{ matrix.url }} \
            --checksum ${{ matrix.checksum }}
          swift sdk list
      - name: Install `curl` and `unzip`
        run: apt-get update && apt-get install -y curl unzip
      - name: Install Android NDK
        run: curl -fSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r30-linux.zip
      - name: Unzip Android NDK
        run: unzip -qo ndk.zip
      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$PWD/android-ndk-r30" >> "$GITHUB_ENV"
      - name: Link NDK into Swift SDK
        # The bundle's `ndk-sysroot` is a placeholder until this script points it at a real NDK.
        # SwiftPM installs SDKs under the passwd home directory, not `$HOME` (which Actions overrides
        # inside containers), so ask it where the bundle actually is.
        run: |
          SDK_DIR=$(swift sdk configure --show-configuration ${{ matrix.sdk }} x86_64-unknown-linux-android${{ matrix.android-api }} | sed -n 's/^sdkRootPath: //p' | xargs dirname)
          echo "SWIFT_ANDROID_SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"
          bash "$SDK_DIR/scripts/setup-android-sdk.sh"
      - name: Build JBird (${{ matrix.swift }})
        # Select the SDK by target triple rather than bundle ID. The bundle defines one SDK per
        # architecture and API level under a single ID, and SwiftPM 6.3 picks the first (aarch64)
        # when given the ID; `--triple` only disambiguates on 6.4 and later.
        run: swift build -v --swift-sdk x86_64-unknown-linux-android${{ matrix.android-api }} --build-path .build ${{ matrix.extra-flags }}
      - name: Stage Swift Runtime
        # The test binaries link the Swift runtime dynamically. Ship the SDK's runtime libraries in
        # the artifact so test-android-spm can push them to the emulator without installing the SDK.
        run: |
          mkdir -p .build/android-runtime
          cp "$SWIFT_ANDROID_SDK_DIR/swift-resources/usr/lib/swift-x86_64/android/"*.so .build/android-runtime/
      - name: Install `zip`
        run: apt-get update && apt-get install -y zip
      - name: Compress Build
        run: zip -r build.zip .build
      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: android-build-${{ matrix.swift }}
          path: build.zip

  test-android-spm:
    name: Test JBird (Android)
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.4"]
        include:
          - swift: "6.4"
            # Emulator system image. Must be at least the `android-api` the build targeted, and at
            # least 24 so that `adb shell` propagates exit codes.
            emulator-api: "34"
    needs: build-android-spm
    runs-on: ubuntu-latest
    env:
      REMOTE_DIR: /data/local/tmp/jbird-tests
    steps:
      - name: Download Build
        uses: actions/download-artifact@v8
        with:
          name: android-build-${{ matrix.swift }}
          path: .
      - name: Decompress Build
        run: unzip -q build.zip
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android Emulator (API ${{ matrix.emulator-api }})
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "emulator" "platform-tools" "system-images;android-${{ matrix.emulator-api }};default;x86_64"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # Pin the AVD directory so `avdmanager` and `emulator` agree on where AVDs live.
          mkdir -p "$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
      - name: Create Emulator
        run: |
          echo no | avdmanager create avd --force --name jbird --package "system-images;android-${{ matrix.emulator-api }};default;x86_64"
          emulator -list-avds
      - name: Boot Emulator
        run: |
          ls -l /dev/kvm
          emulator -accel-check
          emulator -avd jbird -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -accel on > emulator.log 2>&1 &
          EMULATOR_PID=$!
          for _ in $(seq 1 60); do
            if ! kill -0 "$EMULATOR_PID" 2> /dev/null; then
              echo "::error::Emulator exited before boot completed"
              cat emulator.log
              exit 1
            fi
            if [ "$(adb shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = "1" ]; then
              adb shell getprop ro.build.version.release
              exit 0
            fi
            sleep 5
          done
          echo "::error::Emulator did not finish booting within 5 minutes"
          tail -n 100 emulator.log
          exit 1
      - name: Push Tests
        # Each `<Target>-test-runner` loads its `<Target>.so` from `$ORIGIN`, so everything lives in
        # one flat directory alongside the Swift runtime and the NDK's libc++.
        run: |
          mkdir stage
          cp -R .build/debug/*-test-runner .build/debug/*.so .build/debug/*.bundle .build/android-runtime/*.so stage/
          cp "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" stage/
          adb push stage "$REMOTE_DIR"
          adb shell "chmod +x $REMOTE_DIR/*-test-runner"
      - name: Test JBird (${{ matrix.swift }})
        run: |
          for runner in .build/debug/*-test-runner; do
            name=$(basename "$runner")
            echo "::group::$name"
            adb shell "cd $REMOTE_DIR && LD_LIBRARY_PATH=. ./$name --testing-library swift-testing"
            echo "::endgroup::"
          done
      - name: Print Emulator Log
        if: failure()
        run: tail -n 200 emulator.log || true
      - name: Upload Emulator Log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-log-${{ matrix.swift }}
          path: emulator.log

  lint:
    name: Lint
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Toolchain
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.15
      - name: Select Xcode Version
        run: ./.scripts/xcode-select
      - name: Lint with SwiftFormat
        run: mise run lint:swift
      - name: Lint with clang-format
        run: mise run lint:c

  lint-docc:
    name: Validate Documentation
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Toolchain
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.15
      - name: Select Xcode Version
        run: ./.scripts/xcode-select
      - name: Validate Documentation
        run: mise run check-docc

  build-xcframework:
    name: Build XCFrameworks
    strategy:
      fail-fast: false
      matrix:
        target: [JBird, JBirdCore, JBirdBuilders, JBirdCodableSupport]
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Toolchain
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.15
      - name: Select Xcode Version
        run: ./.scripts/xcode-select 27.1
      - name: Build XCFramework
        run: mise run build-xcframework ${{ matrix.target }}

  coverage:
    name: Measure Test Coverage
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select 27.1
      - name: Run llvm-cov
        env:
          FAIL_ON_THRESHOLD: "true"
          COVERAGE_THRESHOLD: "80"
          REPORT_DIR: "coverage"
        run: .scripts/coverage
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage/
          if-no-files-found: error
          retention-days: 7
      - name: Upload to codecov.io
        if: ${{ always() }}
        uses: codecov/codecov-action@v6
        with:
          files: coverage/coverage.lcov
          flags: swiftpm,llvm-cov
          name: ${{ github.workflow }}-${{ github.run_id }}
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  static-analyzer:
    name: Run Static Analyzer
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select
      - name: Analyze C parsing core
        env:
          DERIVED_DATA: ${{ runner.temp }}/analyzer-derived-data
        run: |
          set -eo pipefail
          rm -rf "$DERIVED_DATA"
          xcodebuild \
            -project JBird.xcodeproj \
            -scheme JBirdParser \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            clean analyze
          rm -rf "$DERIVED_DATA"

  validate-pr:
    name: Validate Pull Request
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - build-ios-xcode
      - build-tvos-xcode
      - build-watchos-xcode
      - build-macos-xcode
      - build-visionos-xcode
      - build-macos-spm
      - test-macos-spm
      - build-ubuntu-spm
      - test-ubuntu-spm
      - build-windows-spm
      - test-windows-spm
      - build-wasm-spm
      - test-wasm-spm
      - build-android-spm
      - test-android-spm
      - build-xcframework
      - lint
      - lint-docc
      - coverage
      - static-analyzer
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream jobs
        run: |
          if [[ "${{ needs.build-ios-xcode.result }}" == "failure" ]] || \
            [[ "${{ needs.build-tvos-xcode.result }}" == "failure" ]] || \
            [[ "${{ needs.build-watchos-xcode.result }}" == "failure" ]] || \
            [[ "${{ needs.build-macos-xcode.result }}" == "failure" ]] || \
            [[ "${{ needs.build-visionos-xcode.result }}" == "failure" ]] || \
            [[ "${{ needs.build-macos-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.test-macos-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.build-ubuntu-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.test-ubuntu-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.build-windows-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.test-windows-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.build-wasm-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.test-wasm-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.build-android-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.test-android-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.build-xcframework.result }}" == "failure" ]] || \
            [[ "${{ needs.lint.result }}" == "failure" ]] || \
            [[ "${{ needs.lint-docc.result }}" == "failure" ]] || \
            [[ "${{ needs.coverage.result }}" == "failure" ]] || \
            [[ "${{ needs.static-analyzer.result }}" == "failure" ]]; then
            echo "❌ Required job failed."
            exit 1
          else
            echo "✅ All required jobs completed successfully."
          fi
