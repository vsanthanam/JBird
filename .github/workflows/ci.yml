name: JBird CI
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - "main"
      - "*release*"
  pull_request:
    branches:
      - "main"
      - "*release*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-xcode:
    name: Build JBird (iOS)
    strategy:
      fail-fast: false
      matrix:
        version: ["27.0", "26.6", "18.6", "17.7", "16.6"]
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select 27.0
      - name: Build JBird for iOS ${{ matrix.version }}
        run: ./.scripts/build-ios-xcode JBird ${{ matrix.version }}

  build-tvos-xcode:
    name: Build JBird (tvOS)
    strategy:
      fail-fast: false
      matrix:
        version: ["27.0", "26.6", "18.6", "17.7", "16.6"]
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select 27.0
      - name: Build JBird for tvOS ${{ matrix.version }}
        run: ./.scripts/build-tvos-xcode JBird ${{ matrix.version }}

  build-watchos-xcode:
    name: Build JBird (watchOS)
    strategy:
      fail-fast: false
      matrix:
        version: ["27.0", "26.6", "11.6", "10.7", "9.6"]
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select 27.0
      - name: Build JBird for watchOS ${{ matrix.version }}
        run: ./.scripts/build-watchos-xcode JBird ${{ matrix.version }}

  build-macos-xcode:
    name: Build JBird (macOS)
    strategy:
      fail-fast: false
      matrix:
        version: ["27.0", "26.5"]
        include:
          - version: "27.0"
            runner: xcode-27
            xcode: "27.0"
          - version: "26.5"
            runner: macos-26
            xcode: "26.6"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select ${{ matrix.xcode }}
      - name: List SDKs
        run: xcodebuild -showsdks | grep macosx
      - name: Build JBird for macOS ${{ matrix.version }}
        run: ./.scripts/build-macos-xcode JBird ${{ matrix.version }}

  build-maccatalyst-xcode:
    name: Build JBird (Mac Catalyst)
    strategy:
      fail-fast: false
      matrix:
        version: ["27.0", "26.5"]
        include:
          - version: "27.0"
            runner: xcode-27
            xcode: "27.0"
          - version: "26.5"
            runner: macos-26
            xcode: "26.6"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select ${{ matrix.xcode }}
      - name: List SDKs
        run: xcodebuild -showsdks | grep macosx
      - name: Build JBird for Mac Catalyst ${{ matrix.version }}
        run: ./.scripts/build-maccatalyst-xcode JBird ${{ matrix.version }}

  build-visionos-xcode:
    name: Build JBird (visionOS)
    strategy:
      fail-fast: false
      matrix:
        version: ["27.0", "26.6", "2.6", "1.7"]
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select 27.0
      - name: Build JBird for visionOS ${{ matrix.version }}
        run: ./.scripts/build-visionos-xcode JBird ${{ matrix.version }}

  build-macos-spm:
    name: Build JBird (macOS)
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2", "6.3", "6.4"]
        include:
          - swift: "6.2"
            runner: "macos-26"
            xcode: "26.6"
          - swift: "6.3"
            runner: "macos-26"
            xcode: "26.6"
          - swift: "6.4"
            runner: "xcode-27"
            xcode: "27.0"
    runs-on: ${{ matrix.runner }}
    outputs:
      artifact-name: macos-build
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select ${{ matrix.xcode }}
      - name: Build JBird
        run: swift build -v --build-tests --build-path .build
      - name: Compress Build
        run: zip -r build.zip .build
      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: macos-build-${{ matrix.swift }}
          path: build.zip

  test-macos-spm:
    name: Test JBird (macOS)
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2", "6.3", "6.4"]
        include:
          - swift: "6.2"
            runner: "macos-26"
            xcode: "26.6"
          - swift: "6.3"
            runner: "macos-26"
            xcode: "26.6"
          - swift: "6.4"
            runner: "xcode-27"
            xcode: "27.0"
    needs: build-macos-spm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Xcode Version
        run: ./.scripts/xcode-select ${{ matrix.xcode }}
      - name: Download Build
        uses: actions/download-artifact@v8
        with:
          name: macos-build-${{ matrix.swift }}
          path: .
      - name: Decompress Build
        run: unzip build.zip
      - name: Test JBird
        shell: bash
        run: swift test --skip-build 2>&1 | tee test-output.log
      - name: Summarize Tests
        if: ${{ always() }}
        run: ./.scripts/summarize-tests "macOS · Swift ${{ matrix.swift }}" test-output.log

  build-ubuntu-spm:
    name: Build JBird (Ubuntu)
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2", "6.3", "6.4"]
        include:
          - swift: "6.2"
            toolchain: "6.2.3"
          - swift: "6.3"
            toolchain: "6.3.3"
          - swift: "6.4"
            toolchain: "6.4.0"
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ubuntu-build
    container:
      image: swift:${{ matrix.toolchain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build JBird
        run: swift build -v --build-tests --build-path .build
      - name: Install `zip`
        run: apt-get update && apt-get install -y zip
      - name: Compress Build
        run: zip -r build.zip .build
      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-build-${{ matrix.swift }}
          path: build.zip

  test-ubuntu-spm:
    name: Test JBird (Ubuntu)
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2", "6.3", "6.4"]
        include:
          - swift: "6.2"
            toolchain: "6.2.3"
          - swift: "6.3"
            toolchain: "6.3.3"
          - swift: "6.4"
            toolchain: "6.4.0"
    needs: build-ubuntu-spm
    runs-on: ubuntu-latest
    container:
      image: swift:${{ matrix.toolchain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download Build
        uses: actions/download-artifact@v8
        with:
          name: ubuntu-build-${{ matrix.swift }}
          path: .
      - name: Install `unzip`
        run: apt-get update && apt-get install -y unzip
      - name: Decompress Build
        run: unzip build.zip
      - name: Test JBird
        shell: bash
        run: swift test --skip-build 2>&1 | tee test-output.log
      - name: Summarize Tests
        if: ${{ always() }}
        run: ./.scripts/summarize-tests "Ubuntu · Swift ${{ matrix.swift }}" test-output.log

  build-windows-spm:
    name: Build JBird (Windows)
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2", "6.3", "6.4"]
        include:
          - swift: "6.2"
            toolchain: "6.2.3"
          - swift: "6.3"
            toolchain: "6.3.3"
          - swift: "6.4"
            toolchain: "6.4.0"
            # The 6.4 build engine touches resource bundles while their contents are still being
            # written. Compiling swift-syntax from source instead of using the prebuilt keeps the
            # two tasks apart. See https://github.com/vsanthanam/JBird/issues/436.
            extra-flags: "--disable-experimental-prebuilts"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-${{ matrix.toolchain }}-release
          swift-build: ${{ matrix.toolchain }}-RELEASE
      - name: Build JBird
        run: swift build -v --build-tests --disable-xctest --build-path .build -c debug -Xlinker /INCREMENTAL:NO ${{ matrix.extra-flags }}
      - name: Compress Build
        shell: pwsh
        run: |
          Compress-Archive -Path ".build" -DestinationPath "build.zip" -Force
      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-${{ matrix.swift }}
          path: build.zip

  test-windows-spm:
    name: Test JBird (Windows)
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2", "6.3", "6.4"]
        include:
          - swift: "6.2"
            toolchain: "6.2.3"
          - swift: "6.3"
            toolchain: "6.3.3"
          - swift: "6.4"
            toolchain: "6.4.0"
    needs: build-windows-spm
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-${{ matrix.toolchain }}-release
          swift-build: ${{ matrix.toolchain }}-RELEASE
      - name: Download Build
        uses: actions/download-artifact@v8
        with:
          name: windows-build-${{ matrix.swift }}
          path: .
      - name: Decompress Build
        shell: pwsh
        run: |
          Expand-Archive -Path "build.zip" -DestinationPath "." -Force
      - name: Test JBird
        shell: bash
        run: swift test --disable-xctest --skip-build 2>&1 | tee test-output.log
      - name: Summarize Tests
        if: ${{ always() }}
        shell: bash
        run: bash ./.scripts/summarize-tests "Windows · Swift ${{ matrix.swift }}" test-output.log

  build-wasm-spm:
    name: Build JBird (WebAssembly)
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2", "6.3", "6.4"]
        include:
          - swift: "6.2"
            toolchain: "6.2.3"
            sdk: "swift-6.2.3-RELEASE_wasm"
            url: "https://download.swift.org/swift-6.2.3-release/wasm-sdk/swift-6.2.3-RELEASE/swift-6.2.3-RELEASE_wasm.artifactbundle.tar.gz"
            checksum: "394040ecd5260e68bb02f6c20aeede733b9b90702c2204e178f3e42413edad2a"
          - swift: "6.3"
            toolchain: "6.3.3"
            sdk: "swift-6.3.3-RELEASE_wasm"
            url: "https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz"
            checksum: "cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7"
          - swift: "6.4"
            toolchain: "6.4.0"
            sdk: "swift-6.4.0-RELEASE_wasm"
            url: "https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz"
            checksum: "f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d"
    runs-on: ubuntu-latest
    container:
      image: swift:${{ matrix.toolchain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Swift WASM (${{ matrix.swift }})
        run: |
          swift sdk install ${{ matrix.url }} \
            --checksum ${{ matrix.checksum }}
          swift sdk list
      - name: Build JBird (${{ matrix.swift }})
        run: swift build -v --swift-sdk ${{ matrix.sdk }} --build-path .build
      - name: Install `zip`
        run: apt-get update && apt-get install -y zip
      - name: Compress Build
        run: zip -r build.zip .build
      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: wasm-build-${{ matrix.swift }}
          path: build.zip

  build-android-spm:
    name: Build JBird (Android)
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2", "6.3", "6.4"]
        include:
          - swift: "6.2"
            toolchain: "6.2.3"
          - swift: "6.3"
            toolchain: "6.3.3"
          - swift: "6.4"
            toolchain: "6.4.0"
    runs-on: ubuntu-latest
    outputs:
      artifact-name: android-build-${{ matrix.swift }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build JBird
        uses: skiptools/swift-android-action@v2
        with:
          swift-version: ${{ matrix.toolchain }}
          build-package: true
          build-tests: false
          run-tests: false
      - name: Install `zip`
        run: sudo apt-get update && sudo apt-get install -y zip
      - name: Compress Build
        run: zip -r build.zip .build
      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: android-build-${{ matrix.swift }}
          path: build.zip

  lint:
    name: Lint
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Toolchain
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.15
      - name: Select Xcode Version
        run: ./.scripts/xcode-select
      - name: Lint with SwiftFormat
        run: mise run lint:swift
      - name: Lint with clang-format
        run: mise run lint:c

  lint-docc:
    name: Validate Documentation
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select
      - name: Validate Documentation
        run: ./.scripts/lint-docc

  build-xcframework:
    name: Build XCFrameworks
    strategy:
      fail-fast: false
      matrix:
        target: [JBird, JBirdCore, JBirdBuilders, JBirdCodableSupport]
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Toolchain
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.15
      - name: Select Xcode Version
        run: ./.scripts/xcode-select 27.0
      - name: Build XCFramework
        run: ./.scripts/build-xcframework ${{ matrix.target }}

  coverage:
    name: Measure Test Coverage
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select
      - name: Run llvm-cov
        env:
          FAIL_ON_THRESHOLD: "true"
          COVERAGE_THRESHOLD: "80"
          REPORT_DIR: "coverage"
        run: .scripts/coverage
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage/
          if-no-files-found: error
          retention-days: 7
      - name: Upload to codecov.io
        if: ${{ always() }}
        uses: codecov/codecov-action@v6
        with:
          files: coverage/coverage.lcov
          flags: swiftpm,llvm-cov
          name: ${{ github.workflow }}-${{ github.run_id }}
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  static-analyzer:
    name: Run Static Analyzer
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select Xcode Version
        run: ./.scripts/xcode-select
      - name: Analyze C parsing core
        env:
          DERIVED_DATA: ${{ runner.temp }}/analyzer-derived-data
        run: |
          set -eo pipefail
          rm -rf "$DERIVED_DATA"
          xcodebuild \
            -project JBird.xcodeproj \
            -scheme JBirdParser \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            clean analyze 2>&1 | tee analyzer-output.log
          rm -rf "$DERIVED_DATA"
      - name: Summarize Analyzer Results
        if: ${{ always() }}
        run: |
          WARNINGS="$(grep -E '^[^ :]+:[0-9]+:[0-9]+: warning:' analyzer-output.log | sed "s|$GITHUB_WORKSPACE/||g" | sort -u || true)"
          {
            echo "### Static Analyzer (JBirdParser)"
            echo ""
            if [ -z "$WARNINGS" ]; then
              echo "✅ No warnings reported."
            else
              echo "⚠️ $(echo "$WARNINGS" | wc -l | tr -d ' ') warning(s) reported."
              echo ""
              echo "<details>"
              echo "<summary>Warnings</summary>"
              echo ""
              echo '```'
              echo "$WARNINGS"
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  validate-pr:
    name: Validate Pull Request
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - build-ios-xcode
      - build-tvos-xcode
      - build-watchos-xcode
      - build-macos-xcode
      - build-visionos-xcode
      - build-macos-spm
      - test-macos-spm
      - build-ubuntu-spm
      - test-ubuntu-spm
      - build-windows-spm
      - test-windows-spm
      - build-wasm-spm
      - build-android-spm
      - build-xcframework
      - lint
      - lint-docc
      - coverage
      - static-analyzer
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## Pull Request Validation"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            jq -r '
              to_entries[]
              | .value.result as $r
              | (if $r == "success" then "✅"
                 elif $r == "failure" then "❌"
                 elif $r == "cancelled" then "🚫"
                 else "⏭️" end) as $icon
              | "| `\(.key)` | \($icon) \($r) |"
            ' <<< "$NEEDS"
          } >> "$GITHUB_STEP_SUMMARY"

          if jq -e 'any(.[]; .result == "failure")' <<< "$NEEDS" >/dev/null; then
            echo "❌ Required job failed."
            exit 1
          else
            echo "✅ All required jobs completed successfully."
          fi
