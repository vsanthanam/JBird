name: JBird CI
permissions:
  contents: read
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Analyze Changes
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.set.outputs.swift }}
      c: ${{ steps.set.outputs.c }}
      yaml: ${{ steps.set.outputs.yaml }}
      markdown: ${{ steps.set.outputs.markdown }}
      code: ${{ steps.set.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get changed files
        id: changed
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "swift=true" >> $GITHUB_OUTPUT
            echo "c=true" >> $GITHUB_OUTPUT
            echo "yaml=true" >> $GITHUB_OUTPUT
            echo "markdown=true" >> $GITHUB_OUTPUT
            echo "code=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          CHANGED_FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }})
          echo "Changed files:"
          echo "$CHANGED_FILES"

          HAS_SWIFT=false
          HAS_C=false
          HAS_YAML=false
          HAS_MD=false
          ONLY_MD=true

          for file in $CHANGED_FILES; do
            [[ "$file" =~ \.swift$ ]] && HAS_SWIFT=true
            [[ "$file" =~ \.c$ || "$file" =~ \.h$ ]] && HAS_C=true
            [[ "$file" =~ \.ya?ml$ ]] && HAS_YAML=true
            [[ "$file" =~ \.md$ ]] && HAS_MD=true

            if [[ ! "$file" =~ \.md$ ]]; then
              ONLY_MD=false
            fi
          done

          echo "swift=$([[ $HAS_SWIFT == true ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "c=$([[ $HAS_C == true ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "yaml=$([[ $HAS_YAML == true ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "markdown=$([[ $HAS_MD == true ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "code=$([[ $ONLY_MD == true ]] && echo false || echo true)" >> $GITHUB_OUTPUT
      - name: Set final outputs
        id: set
        run: |
          echo "swift=${{ steps.changed.outputs.swift }}" >> $GITHUB_OUTPUT
          echo "c=${{ steps.changed.outputs.c }}" >> $GITHUB_OUTPUT
          echo "yaml=${{ steps.changed.outputs.yaml }}" >> $GITHUB_OUTPUT
          echo "markdown=${{ steps.changed.outputs.markdown }}" >> $GITHUB_OUTPUT
          echo "code=${{ steps.changed.outputs.code }}" >> $GITHUB_OUTPUT
  build-xcode:
    strategy:
      matrix:
        platform: [macos, maccatalyst, ios, watchos, tvos, visionos]
        scheme: [JBird, JBirdCore, JBirdBuilders]
    name: Build with Xcode (${{ matrix.platform }}, ${{ matrix.scheme }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: macos-26
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Select Xcode Version
      run: ./.scripts/xcode-select
    - name: Build JBird
      run: ./.scripts/build-${{ matrix.platform }}-xcode ${{ matrix.scheme }}
  swiftformat:
    name: Run SwiftFormat 
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' || needs.changes.outputs.yaml == 'true' }}
    runs-on: macos-26
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Select Xcode Version
      run: ./.scripts/xcode-select
    - name: Lint with SwiftFormat
      run: ./.scripts/lint-swiftformat
  build-macos-spm:
    name: Build JBird (macOS)
    strategy: &macos-spm-strategy
      matrix:
        swift: ["6.1", "6.2"]
        include:
          - swift: "6.1"
            runner: macos-15
            xcode: "16.4"
          - swift: "6.2"
            runner: macos-26
            xcode: "26.0"
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' || needs.changes.outputs.c == 'true' || needs.changes.outputs.yaml == 'true' }}
    runs-on: ${{ matrix.runner }}
    outputs:
      artifact-name: macos-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode Version
        run: ./.scripts/xcode-select ${{ matrix.xcode }}
      - name: Build JBird
        run: swift build -v --build-path .build
      - name: Compress Build
        run: zip -r build.zip .build
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-${{ matrix.swift }}
          path: build.zip

  test-macos-spm:
    name: Test JBird (macOS)
    strategy: *macos-spm-strategy
    needs: [build-macos-spm, changes]
    if: ${{ needs.changes.outputs.swift == 'true' || needs.changes.outputs.c == 'true' || needs.changes.outputs.yaml == 'true' }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Xcode Version
        run: ./.scripts/xcode-select ${{ matrix.xcode }}
      - name: Download Build
        uses: actions/download-artifact@v4
        with:
          name: macos-build-${{ matrix.swift }}
          path: .
      - name: Decompress Build
        run: unzip build.zip
      - name: Run Tests with Coverage
        run: |
          set -eo pipefail
          COVERAGE_DIR="$GITHUB_WORKSPACE/.build/coverage"
          mkdir -p "$COVERAGE_DIR"
          rm -f "$COVERAGE_DIR"/jbird-${{ matrix.swift }}-*.profraw 2>/dev/null || true
          export LLVM_PROFILE_FILE="$COVERAGE_DIR/jbird-${{ matrix.swift }}-%p.profraw"

          swift test --enable-code-coverage --disable-sandbox --build-path .build
      - name: Generate Coverage Reports
        id: coverage-report
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          SWIFT_VERSION: ${{ matrix.swift }}
        run: |
          set -eo pipefail
          BIN_PATH=$(swift build --build-path .build --show-bin-path | tail -n 1)
          COVERAGE_DIR=".build/coverage"
          RAW_PROFILE_GLOB="jbird-${SWIFT_VERSION}-*.profraw"
          RAW_PROFILES=()

          if [ -d "$COVERAGE_DIR" ]; then
            while IFS= read -r profile; do
              RAW_PROFILES+=("$profile")
            done < <(find "$COVERAGE_DIR" -name "$RAW_PROFILE_GLOB" -type f 2>/dev/null | sort)
          fi

          if [ ${#RAW_PROFILES[@]} -eq 0 ]; then
            while IFS= read -r profile; do
              RAW_PROFILES+=("$profile")
            done < <(find .build -name "$RAW_PROFILE_GLOB" -type f 2>/dev/null | sort)
          fi

          if [ ${#RAW_PROFILES[@]} -eq 0 ]; then
            echo "No coverage profiles found for Swift $SWIFT_VERSION" >&2
            exit 1
          fi

          COVERAGE_DIR=".build/coverage"
          mkdir -p "$COVERAGE_DIR"
          PROF_PATH="$COVERAGE_DIR/coverage-${SWIFT_VERSION}.profdata"
          LCOV_OUTPUT="$COVERAGE_DIR/coverage-${{ matrix.swift }}.lcov"
          SUMMARY_OUTPUT="$COVERAGE_DIR/coverage-summary-${{ matrix.swift }}.txt"

          xcrun llvm-profdata merge -sparse "${RAW_PROFILES[@]}" -o "$PROF_PATH"

          TEST_BINARIES=()
          while IFS= read -r bundle; do
            binary_name="$(basename "$bundle" .xctest)"
            binary_path="$bundle/Contents/MacOS/$binary_name"

            if [ -f "$binary_path" ]; then
              TEST_BINARIES+=("$binary_path")
            fi
          done < <(find "$BIN_PATH" -maxdepth 1 -type d -name "*.xctest" 2>/dev/null | sort)

          if [ ${#TEST_BINARIES[@]} -eq 0 ]; then
            while IFS= read -r bundle; do
              binary_name="$(basename "$bundle" .xctest)"
              binary_path="$bundle/Contents/MacOS/$binary_name"

              if [ -f "$binary_path" ]; then
                TEST_BINARIES+=("$binary_path")
              fi
            done < <(find "$BIN_PATH" -type d -name "*.xctest" 2>/dev/null | sort)
          fi

          if [ ${#TEST_BINARIES[@]} -eq 0 ]; then
            echo "No test binaries found within $BIN_PATH" >&2
            exit 1
          fi

          xcrun llvm-cov export -format="lcov" \
            -instr-profile "$PROF_PATH" \
            "${TEST_BINARIES[@]}" > "$LCOV_OUTPUT"

          xcrun llvm-cov report \
            --ignore-filename-regex='(^|/)Tests/' \
            -instr-profile "$PROF_PATH" \
            "${TEST_BINARIES[@]}" > "$SUMMARY_OUTPUT"

          echo "lcov=$LCOV_OUTPUT" >> "$GITHUB_OUTPUT"
          echo "summary=$SUMMARY_OUTPUT" >> "$GITHUB_OUTPUT"
      - name: Publish Coverage Summary
        run: |
          {
            echo "### macOS Swift ${{ matrix.swift }} coverage"
            echo
            echo '```'
            cat "${{ steps.coverage-report.outputs.summary }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ${{ steps.coverage-report.outputs.lcov }}
          flags: macos-swift-${{ matrix.swift }}
          name: macos-swift-${{ matrix.swift }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  build-ubuntu-spm:
    name: Build JBird (Ubuntu)
    strategy: &ubuntu-spm-strategy
      matrix:
        swift: ["6.1", "6.2"]
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' || needs.changes.outputs.c == 'true' || needs.changes.outputs.yaml == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ubuntu-build
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build JBird
        run: swift build -v --build-path .build
      - name: Install `zip`
        run: apt-get update && apt-get install -y zip
      - name: Compress Build
        run: zip -r build.zip .build
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-build-${{ matrix.swift }}
          path: build.zip

  test-ubuntu-spm:
    name: Test JBird (Ubuntu)
    strategy: *ubuntu-spm-strategy
    needs: [build-ubuntu-spm, changes]
    if: ${{ needs.changes.outputs.swift == 'true' || needs.changes.outputs.c == 'true' || needs.changes.outputs.yaml == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Build
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-build-${{ matrix.swift }}
          path: .
      - name: Install `unzip`
        run: apt-get update && apt-get install -y unzip
      - name: Decompress Build
        run: unzip build.zip
      - name: Test JBird
        run: swift test

  clang-format:
    name: Run clang-format
    needs: changes
    if: ${{ needs.changes.outputs.c == 'true' || needs.changes.outputs.yaml == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Validate formatting
        run: ./.scripts/lint-clang-format
  lint-docc:
    name: Validate Documentation
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' || needs.changes.outputs.yaml == 'true' || needs.changes.outputs.markdown == 'true' }}
    runs-on: macos-26
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Select Xcode Version
      run: ./.scripts/xcode-select
    - name: Validate Documentation
      run: ./.scripts/lint-docc
  build-xcframework:
    strategy:
      matrix:
        target: [JBird, JBirdCore, JBirdBuilders]
    name: Build XCFramework (${{ matrix.target }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: macos-26
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Select Xcode Version
      run: ./.scripts/xcode-select
    - name: Build XCFramework
      run: ./.scripts/build-xcframework ${{ matrix.target }}
  validate-pr:
    name: Validate Pull Request
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - build-xcode
      - build-macos-spm
      - test-macos-spm
      - build-ubuntu-spm
      - test-ubuntu-spm
      - build-xcframework
      - swiftformat
      - clang-format
      - lint-docc
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream jobs
        run: |
          # If any job failed, this status will not be 'success'
          if [[ "${{ needs.build-xcode.result }}" == "failure" ]] || \
            [[ "${{ needs.build-macos-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.test-macos-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.build-ubuntu-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.test-ubuntu-spm.result }}" == "failure" ]] || \
            [[ "${{ needs.build-xcframework.result }}" == "failure" ]] || \
            [[ "${{ needs.swiftformat.result }}" == "failure" ]] || \
            [[ "${{ needs.clang-format.result }}" == "failure" ]] || \
            [[ "${{ needs.lint-docc.result }}" == "failure" ]]; then
            echo "❌ Upstream job failed."
            exit 1
          else
            echo "✅ All required jobs completed successfully."
          fi