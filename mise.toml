[tools]
clang-format = "18.1.8"
swiftformat = "0.63.0"
xcbeautify = "3.2.1"

[tasks."format:swift"]
description = "Format Swift sources with SwiftFormat"
run = "swiftformat ."

[tasks."format:c"]
description = "Format C sources with clang-format"
run = 'find Sources Fuzzer -type f \( -name "*.c" -o -name "*.h" \) -exec clang-format -i "{}" +'

[tasks.format]
description = "Format all sources"
depends = ["format:*"]

[tasks."lint:swift"]
description = "Check Swift formatting with SwiftFormat"
run = "swiftformat . --lint"

[tasks."lint:c"]
description = "Check C formatting with clang-format"
run = 'find Sources Fuzzer -type f \( -name "*.c" -o -name "*.h" \) -exec clang-format --style=file --dry-run --Werror "{}" +'

[tasks."check-docc"]
description = "Build documentation and fail on warnings"
run = "./.scripts/lint-docc"

[tasks.lint]
description = "Check formatting of all sources"
depends = ["lint:*"]

[tasks.build-xcframework]
description = "Build an XCFramework (usage: mise run build-xcframework <target> [--static] [--platforms p1,p2,...])"
run = "./.scripts/build-xcframework"

[tasks."preview:docs"]
description = "Build and serve the combined DocC documentation (usage: mise run preview:docs [--port <port>])"
run = "./.scripts/preview-docs"

[tasks."preview:site"]
description = "Build and serve the website (usage: mise run preview:site [--port <port>] [--theme <ref> | --theme-path <path>])"
run = "./.scripts/preview-site"
