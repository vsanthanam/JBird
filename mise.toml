[tools]
clang-format = "18.1.8"
swiftformat = "0.63.0"
xcbeautify = "3.2.1"

[tasks."fmt:swift"]
description = "Format Swift sources with SwiftFormat"
run = "swiftformat ."

[tasks."fmt:c"]
description = "Format C sources with clang-format"
run = 'find Sources Fuzzer -type f \( -name "*.c" -o -name "*.h" \) -exec clang-format -i "{}" +'

[tasks.fmt]
description = "Format all sources"
depends = ["fmt:*"]

[tasks."lint:swift"]
description = "Check Swift formatting with SwiftFormat"
run = "swiftformat . --lint"

[tasks."lint:c"]
description = "Check C formatting with clang-format"
run = 'find Sources Fuzzer -type f \( -name "*.c" -o -name "*.h" \) -exec clang-format --style=file --dry-run --Werror "{}" +'

[tasks.lint]
description = "Check formatting of all sources"
depends = ["lint:*"]
