[tools]
clang-format = "18.1.8"
swiftformat = "0.64.0"
xcbeautify = "3.2.1"

[tasks.format]
description = "Format all sources"
depends = ["format:*"]

[tasks."format:mise"]
description = "Format the mise.toml file"
run = "mise fmt"

[tasks."format:swift"]
description = "Format Swift sources with SwiftFormat"
run = "swiftformat ."

[tasks."format:c"]
description = "Format C sources with clang-format"
run = 'find Sources Fuzzer -type f \( -name "*.c" -o -name "*.h" \) -exec clang-format -i "{}" +'

[tasks.lint]
description = "Check formatting of all sources"
depends = ["lint:mise", "lint:swift", "lint:c"]

[tasks."lint:mise"]
description = "Check mise.toml formatting"
run = "mise fmt --check"

[tasks."lint:swift"]
description = "Check Swift formatting with SwiftFormat"
run = "swiftformat . --lint"

[tasks."lint:c"]
description = "Check C formatting with clang-format"
run = 'find Sources Fuzzer -type f \( -name "*.c" -o -name "*.h" \) -exec clang-format --style=file --dry-run --Werror "{}" +'

[tasks."lint:docc"]
description = "Build documentation and fail on warnings"
run = "./.scripts/lint-docc"

[tasks."lint:all"]
description = "Check formatting of all sources and build documentation, failing on warnings"
depends = ["lint:*"]

[tasks.benchmark]
description = "Run the benchmark suite with the local checkout (usage: mise run benchmark [--library jbird|foundation|freddy|swiftyjson] [--filter <regex>])"
run = "./.scripts/benchmark run"

[tasks."benchmark:compare"]
description = "Benchmark the local checkout against main or the pinned release, writing Benchmarks/results.txt (usage: mise run benchmark:compare [main|release] [--filter <regex>])"
run = "./.scripts/benchmark compare"

[tasks."benchmark:record"]
description = "Benchmark the local checkout and every other library, regenerating Benchmarks/Results for the website"
run = "./.scripts/benchmark record"

[tasks.build-xcframework]
description = "Build an XCFramework (usage: mise run build-xcframework <target> [--static] [--platforms p1,p2,...])"
run = "./.scripts/build-xcframework"

[tasks."preview:docs"]
description = "Build and serve the combined DocC documentation (usage: mise run preview:docs [--port <port>])"
run = "./.scripts/preview-docs"

[tasks."preview:site"]
description = "Build and serve the website (usage: mise run preview:site [--port <port>] [--theme <ref> | --theme-path <path>])"
run = "./.scripts/preview-site"
